name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Cancel superseded runs on the same branch; the full pipeline is slow enough to matter.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"

jobs:
  build:
    name: Build, test and analyse
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed by the Sonar scanner to decorate pull requests.
      pull-requests: read
    env:
      # Declared at job level so the `if:` guard below can see whether the secret exists.
      # Step-level env is not available to `if:` expressions.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Sonar needs full history to assign blame and compute new-code periods.
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Cache SonarQube analysis data
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # `verify` is the whole quality gate in one command:
      #   Spotless check -> unit tests -> integration tests (Testcontainers) -> JaCoCo merge + threshold
      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Publish test report
        # Runs even when tests failed, so the failure is readable in the run summary.
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: "target/*-reports/TEST-*.xml"
          require_tests: true
          fail_on_failure: false

      - name: Upload coverage and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/site/jacoco-merged/
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 14

      - name: SonarQube Cloud analysis
        # Skipped automatically when the secret is absent, e.g. on pull requests from forks.
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          # Lets the scanner attach the analysis to the right pull request.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -ntp sonar:sonar

  image:
    name: Build and push image
    needs: build
    # Only publish from trusted refs. Pull requests get their image built by `build` only
    # implicitly, so nothing untrusted is ever pushed to the registry.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: meta
        run: |
          # GHCR requires a lowercase path; repository names may contain uppercase.
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [[ '${{ github.ref_type }}' == 'tag' ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(./mvnw -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ${image}:${version}"

      # Paketo buildpacks produce the OCI image; there is no Dockerfile in this repo.
      - name: Build image with buildpacks
        run: |
          ./mvnw -B -ntp spring-boot:build-image -DskipTests \
            -Dspring-boot.build-image.imageName='${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}'

      - name: Tag and push
        run: |
          set -euo pipefail
          image='${{ steps.meta.outputs.image }}'
          version='${{ steps.meta.outputs.version }}'
          docker push "${image}:${version}"

          # Every build is also addressable by commit SHA, which is what deployments should pin.
          docker tag "${image}:${version}" "${image}:sha-${GITHUB_SHA::12}"
          docker push "${image}:sha-${GITHUB_SHA::12}"

          # `latest` tracks release tags only, never a moving branch.
          if [[ '${{ github.ref_type }}' == 'tag' ]]; then
            docker tag "${image}:${version}" "${image}:latest"
            docker push "${image}:latest"
          fi
