spring:
  application:
    name: greeting-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/greeting}
    username: ${SPRING_DATASOURCE_USERNAME:greeting}
    password: ${SPRING_DATASOURCE_PASSWORD:greeting}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  security:
    user:
      username: ${APP_SECURITY_USER_USERNAME:user}
      password: ${APP_SECURITY_USER_PASSWORD:password}
    admin:
      username: ${APP_SECURITY_ADMIN_USERNAME:admin}
      password: ${APP_SECURITY_ADMIN_PASSWORD:password}

logging:
  level:
    io.github.pgatzka.greeting: INFO
